name: our_love_story
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.11.4


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.2
  audioplayers: ^6.6.0
  timeline_tile: ^2.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1
  confetti: ^0.8.0
  shared_preferences: ^2.3.3
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.15.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter:


  uses-material-design: true


  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  image_path: "assets/images/our.png"

