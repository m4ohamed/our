name: our_love_story
description: "Our Love Story V2.0 - Cloud Firestore, Cloudinary, OneSignal Push Notifications, Couples Game Night & Rust Keyframe Video Studio"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Animations
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.2
  confetti: ^0.8.0

  # State Management
  flutter_riverpod: ^3.0.0-dev.3
  riverpod_annotation: ^3.0.0-dev.3

  # Cloud Backend (Firestore + Cloudinary HTTP Upload + OneSignal Push Notifications)
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  onesignal_flutter: ^5.2.9
  http: ^1.3.0

  # Local Storage (Offline Cache)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # Media & Video Playback
  cached_network_image: ^4.0.3
  image_picker: ^1.2.1
  photo_view: ^0.15.0
  audioplayers: ^6.6.0
  video_player: ^2.9.3

  # UI Components
  timeline_tile: ^2.0.0
  flutter_staggered_grid_view: ^0.7.0

  # Security
  local_auth: ^3.0.1
  crypto: ^3.0.3

  # Utils
  path_provider: ^2.1.4
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_gen: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.0-dev.11
  riverpod_lint: ^3.0.0-dev.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  image_path: "assets/images/our.png"
flutter_intl:
  enabled: true
