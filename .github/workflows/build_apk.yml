name: Build Flutter + Rust APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Rust Engine, Run Tests & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject google-services.json from Secret (if provided)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f "android/app/google-services.json" ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Injected android/app/google-services.json from GitHub Secret."
          elif [ -f "android/app/google-services.json" ]; then
            echo "Found existing android/app/google-services.json in repository."
          else
            echo "No google-services.json found; building with offline/hybrid fallback enabled."
          fi

      - name: Set up Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Run Rust Video Engine Unit & Audit Tests (VID-001..VID-016)
        working-directory: rust_video_engine
        run: cargo test -- --nocapture

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Video Engine (.so) for Android ABIs
        working-directory: rust_video_engine
        run: |
          mkdir -p ../android/app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            build --release

      - name: Verify compiled .so libraries
        run: ls -la android/app/src/main/jniLibs/*/librust_video_engine.so

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter Unit & Regression Tests (VID-001..VID-019)
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: our-love-story-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
